[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brandshield-api"
version = "1.0.0"
description = "Evidence-linked brand governance API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pymongo[srv]>=4.13,<5", "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1", "python-docx>=1.1,<2", "PyMuPDF>=1.25,<2",
  "httpx>=0.28,<1", "google-genai>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "asgi-lifespan>=2,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
